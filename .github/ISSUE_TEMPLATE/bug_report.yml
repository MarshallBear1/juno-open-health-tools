name: Bug report
description: Report a reproducible problem in the open tools
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting a problem. Use synthetic examples only. Do not include personal health information, patient records, credentials, tokens, or production secrets. Report suspected vulnerabilities through SECURITY.md instead of this public form.

  - type: dropdown
    id: component
    attributes:
      label: Affected component
      options:
        - MCP app or endpoint
        - Browser extension
        - Symptom diary schema
        - Notion or printable templates
        - Packaging or metadata
        - Documentation
        - Other
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the problem using synthetic, non-identifying data.
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction steps
      placeholder: |
        1. Start from...
        2. Run or select...
        3. Observe...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: v1.3.0 or a commit SHA

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include relevant browser, operating system, Node.js, or MCP client versions.

  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy confirmation
      options:
        - label: I removed personal health information, identifiers, credentials, tokens, and production secrets.
          required: true
